name: turb-gpt-free-register

services:
  app:
    image: ${DOCKER_IMAGE:-qq1371446705/turb-gpt-free-register}:${DOCKER_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    ports:
      - "${APP_PORT:-5000}:5000"
    extra_hosts:
      # Docker Desktop exposes the host through this gateway. Roxy's browser
      # debugger ports are loopback-only, so the app rewrites 127.0.0.1 to it.
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # RoxyBrowser requires host GUI/Chromedriver and is not the Docker default.
      # Override with REGISTRATION_DRIVER=browser_use/skyvern/cloak as needed.
      REGISTRATION_DRIVER: ${REGISTRATION_DRIVER:-protocol}
      # Empty .env values fall back to the Docker Desktop host. A LAN API URL
      # such as http://192.168.31.123:50000 is also supported.
      ROXY_API_BASE: ${ROXY_API_BASE:-http://host.docker.internal:50000}
      ROXY_DEBUGGER_HOST: ${ROXY_DEBUGGER_HOST:-host.docker.internal}
      ROXY_DEBUGGER_RESOLVE_HOST: ${ROXY_DEBUGGER_RESOLVE_HOST:-true}
      ROXY_DRIVER_CACHE_DIR: ${ROXY_DRIVER_CACHE_DIR:-/app/runtime/roxy-drivers}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-data
        target: /app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
