name: registration-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-registration}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-registration}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-registration-local-only}
    ports:
      - "127.0.0.1:${PLATFORM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${PLATFORM_REDIS_PORT:-6379}:6379"
    volumes:
      - platform_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      CONTROL_PLANE_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${PLATFORM_POSTGRES_USER:-registration}:${PLATFORM_POSTGRES_PASSWORD:-registration-local-only}@postgres:5432/${PLATFORM_POSTGRES_DB:-registration}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      READINESS_TIMEOUT: ${CONTROL_PLANE_READINESS_TIMEOUT:-2s}
      STARTUP_TIMEOUT: ${CONTROL_PLANE_STARTUP_TIMEOUT:-45s}
      SHUTDOWN_TIMEOUT: ${CONTROL_PLANE_SHUTDOWN_TIMEOUT:-10s}
      AUTO_MIGRATE: ${CONTROL_PLANE_AUTO_MIGRATE:-true}
      DB_MAX_OPEN_CONNS: ${CONTROL_PLANE_DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${CONTROL_PLANE_DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${CONTROL_PLANE_DB_CONN_MAX_LIFETIME:-30m}
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/control-plane", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  platform_postgres_data:
  platform_redis_data:
