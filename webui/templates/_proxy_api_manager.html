<style>
  #proxyApiManager { width: min(1120px, calc(100vw - 80px)); height: min(800px, calc(100vh - 72px)); max-height: calc(100vh - 72px); padding: 0; border: 1px solid #e2e8f0; border-radius: 18px; background: #f7f9fc; color: #26334b; box-shadow: 0 32px 100px #16213e38; overflow: hidden; }
  #proxyApiManager[open] { display: flex; flex-direction: column; }
  #proxyApiManager::backdrop { background: #101c36a3; backdrop-filter: blur(3px); }
  #proxyApiManager * { box-sizing: border-box; }
  .proxy-manager-head { padding: 24px 28px 20px; background: #fff; border-bottom: 1px solid #e5eaf2; display: flex; align-items: flex-start; gap: 14px; }
  .proxy-manager-icon { width: 44px; height: 44px; background: #edf2ff; color: #4669e8; border: 1px solid #dce5ff; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
  .proxy-manager-head h3 { margin: 0 0 7px; font-size: 20px; font-weight: 750; letter-spacing: -.4px; }
  .proxy-manager-head p { margin: 0; color: #79869c; font-size: 12px; line-height: 1.5; }
  .proxy-manager-head .outlook-import-close { margin-left: auto; }
  .proxy-manager-overview { display: grid; grid-template-columns: 130px 130px 1fr; gap: 12px; padding: 18px 28px 0; }
  .proxy-manager-stat { background: #fff; padding: 12px 16px; border: 1px solid #e5eaf2; border-radius: 10px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#6f7e95; }
  .proxy-manager-stat b { font-size: 24px; font-weight: 700; color: #283953; }
  .proxy-manager-stat b.active { color:#476cec; }
  .proxy-manager-policy { padding: 12px 16px; background:#eef3ff; border:1px solid #dee7ff; border-radius:10px; color:#536b9d; font-size:12px; line-height:1.65; }
  .proxy-manager-policy strong { display:block; color:#3657a1; margin-bottom:3px; }
  .proxy-manager-toolbar { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:20px 28px 12px; }
  .proxy-manager-toolbar b { font-size:14px; }
  .proxy-manager-toolbar small { display:block; color:#8490a3; margin-top:5px; font-size:11px; }
  #proxyApiManager button { cursor:pointer; font:inherit; transition:background .15s, border-color .15s; }
  #proxyApiManager button:disabled { cursor:wait; opacity:.55; }
  #proxyApiManager .jobs-tb-btn { min-height:34px; border:1px solid #dfe5ef; background:#fff; border-radius:7px; padding:7px 12px; font-size:12px; color:#53637b; box-shadow:none; font-weight:600; }
  #proxyApiManager .jobs-tb-btn:hover { background:#f0f4ff; border-color:#c3d1fa; color:#395fd3; }
  #proxyApiManager .jobs-tb-btn--primary { background:#486aee; color:#fff; border-color:#486aee; }
  #proxyApiManager .jobs-tb-btn--primary:hover { background:#3b5edc; color:#fff; }
  .proxy-api-manager-body { padding:0 28px 20px; overflow:auto; flex:1; min-height:0; }
  #proxyApiEntries { display:grid; gap:12px; }
  .proxy-api-entry { background:#fff; border:1px solid #e1e7f0; border-radius:12px; padding:16px 18px; display:grid; gap:13px; }
  .proxy-api-entry.is-selected { border-color:#b9c9fa; box-shadow:inset 3px 0 #6384f4; }
  .proxy-api-entry-head { display:grid; grid-template-columns:50px minmax(160px,1fr) 150px auto; gap:14px; align-items:end; }
  .proxy-api-entry label { display:grid; gap:7px; font-size:11px; font-weight:600; color:#78869b; }
  .proxy-api-entry input:not([type=checkbox]), .proxy-api-entry select { width:100%; height:36px; padding:8px 10px; border:1px solid #e3e9f2; border-radius:7px; background:#f9fbfe; color:#33445e; font-size:12px; outline:none; }
  .proxy-api-entry input:focus, .proxy-api-entry select:focus { border-color:#809afa; box-shadow:0 0 0 3px #5277f015; background:#fff; }
  .proxy-api-entry input[type=checkbox] { width:18px; height:18px; accent-color:#4d72ee; margin:9px 0; cursor:pointer; }
  .proxy-api-entry input[type=url] { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; }
  .proxy-api-entry-actions { display:flex; gap:6px; }
  #proxyApiManager [data-api-action=delete] { border-color:transparent; color:#9ba6b5; }
  #proxyApiManager [data-api-action=delete]:hover { color:#d45564; background:#fff1f3; }
  .proxy-api-entry-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; color:#8a97aa; font-size:11px; }
  [data-api-effective] { color:#5872a9; }
  [data-api-result] { font-size:12px; line-height:1.65; color:#63748b; }
  [data-api-result]:empty { display:none; }
  .proxy-api-manager-summary { color:#7b8aa0; font-size:12px; }
  .proxy-manager-foot { display:flex; align-items:center; gap:10px; padding:17px 28px; background:#fff; border-top:1px solid #e4eaf3; }
  .proxy-manager-foot .proxy-api-manager-summary { margin-right:auto; }
  #proxyApiManagerError { color:#62789a; padding:0 28px 12px; font-size:12px; min-height:0; }
  #proxyApiManagerError:empty { display:none; }
  .proxy-manager-empty { padding:40px;text-align:center;color:#8c99ad;font-size:13px; }
</style>
<dialog id="proxyApiManager" aria-labelledby="proxyApiManagerTitle">
  <header class="proxy-manager-head">
    <div class="proxy-manager-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6M12 10v4"/></svg></div>
    <div><h3 id="proxyApiManagerTitle">API管理</h3><p>管理代理来源，统一分配每一次任务的动态出口。</p></div>
    <button type="button" class="outlook-import-close" data-api-manager-close aria-label="关闭 API管理">×</button>
  </header>
  <div class="proxy-manager-overview">
    <div class="proxy-manager-stat">API 总数<b id="proxyApiTotalCount">0</b></div>
    <div class="proxy-manager-stat">已启用<b class="active" id="proxyApiEnabledCount">0</b></div>
    <div class="proxy-manager-policy"><strong>多选随机调度 · 共用健康检查次数</strong>参数以配置页为准，查活仅覆盖地区。提取成功与出口检测分开显示。</div>
  </div>
  <div class="proxy-manager-toolbar"><div><b>代理来源</b><small>选中即参与调度；复制、打开和检测均使用下方显示的实际参数。</small></div><button type="button" class="jobs-tb-btn jobs-tb-btn--primary" id="proxyApiAdd">＋ 添加 API</button></div>
  <div class="proxy-api-manager-body"><div id="proxyApiEntries"></div></div>
  <div id="proxyApiManagerError" role="status"></div>
  <footer class="proxy-manager-foot"><span class="proxy-api-manager-summary" id="proxyApiDraftSummary"></span><button type="button" class="jobs-tb-btn" data-api-manager-close>取消</button><button type="button" class="jobs-tb-btn jobs-tb-btn--primary" id="proxyApiSave">保存 API</button></footer>
</dialog>
<script>
function proxyApiEntriesV2() {
  const raw = String(proxyApiValueV2('PROXY_API_SOURCES_JSON', '') || '').trim();
  if (raw) return JSON.parse(raw);
  const url = String(proxyApiValueV2('PROXY_API_URL', '') || 'https://api.cliproxy.io/white/api');
  return [{id:'legacy', name:'原有 API', url, provider:proxyApiDetectProviderV2(url), enabled:true}];
}
function proxyApiDetectProviderV2(raw) {
  try {
    const u = new URL(raw);
    return ((u.searchParams.has('zone') && u.searchParams.has('ptype')) || u.hostname === 'bestgo.work' || u.hostname.endsWith('.bestgo.work')) ? 'b2proxy' : 'cliproxy';
  } catch (_) { return 'cliproxy'; }
}
function proxyApiEffectiveLinkV2(entry) {
  const region = String(proxyApiValueV2('PROXY_API_REGION', 'Rand') || 'Rand').trim() || 'Rand';
  const url = new URL(entry.url.replace(/\{(?:region|country|country_code)\}/g, encodeURIComponent(region)));
  if (!['http:', 'https:'].includes(url.protocol)) throw new Error('API地址需为 HTTP/HTTPS URL');
  const count = String(Math.max(1, Math.min(20, Number(proxyApiValueV2('PROXY_API_NUM', 1)) || 1)));
  const duration = String(Math.max(1, Math.min(360, Number(proxyApiValueV2('PROXY_API_TIME', 10)) || 10)));
  const session = String(proxyApiValueV2('PROXY_API_SESSION_TYPE', 'sticky') || 'sticky').toLowerCase();
  const delimiter = String(proxyApiValueV2('PROXY_API_FORMAT', 'n') || 'n');
  const type = String(proxyApiValueV2('PROXY_API_TYPE', 'json') || 'json');
  const b2 = entry.provider === 'b2proxy';
  const replace = b2 ? ['region','count','stype','split','sesstype'] : ['region','num','time','format','type'];
  for (const key of [...url.searchParams.keys()]) if (replace.includes(key.toLowerCase())) url.searchParams.delete(key);
  if (!b2 || region.toLowerCase() !== 'rand') url.searchParams.set('region', region);
  if (b2) {
    url.searchParams.set('count', count); url.searchParams.set('stype', type);
    url.searchParams.set('split', delimiter === 'rn' ? '\\r\\n' : '\\n');
    url.searchParams.set('sessType', session);
    if (!url.searchParams.has('proto')) url.searchParams.set('proto', 'http');
  } else {
    url.searchParams.set('num', count);
    if (session !== 'rotating') url.searchParams.set('time', duration);
    url.searchParams.set('format', delimiter); url.searchParams.set('type', type);
  }
  return url.toString();
}
function proxyApiSummaryV2(entries) {
  const count = entries.filter(x => x.enabled).length;
  return `共 ${entries.length} 个 API，已选 ${count} 个${count > 1 ? ' · 每次尝试随机选择' : count ? '' : ' · API任务将提示选择来源'}`;
}
function renderProxyApiRowV2(entry) {
  const node = document.createElement('div');
  node.className = 'proxy-api-entry'; node.dataset.apiId = entry.id;
  node.innerHTML = `<div class="proxy-api-entry-head">
    <label>选中<input type="checkbox" data-api-field="enabled"${entry.enabled ? ' checked' : ''}></label>
    <label>名称<input data-api-field="name" maxlength="80" value="${attrEsc(entry.name)}" placeholder="API名称"></label>
    <label>供应商<select data-api-field="provider" data-ui-native="true"><option value="cliproxy"${entry.provider === 'cliproxy' ? ' selected' : ''}>CliProxy</option><option value="b2proxy"${entry.provider === 'b2proxy' ? ' selected' : ''}>b2proxy</option></select></label>
    <div class="proxy-api-entry-actions"><button type="button" class="jobs-tb-btn" data-api-action="test">检测出口</button><button type="button" class="jobs-tb-btn" data-api-action="copy">复制</button><button type="button" class="jobs-tb-btn" data-api-action="open">打开</button><button type="button" class="jobs-tb-btn" data-api-action="delete">删除</button></div>
    </div><label>API地址<input type="url" data-api-field="url" maxlength="4096" spellcheck="false" autocomplete="off" value="${attrEsc(entry.url)}" placeholder="粘贴供应商生成的完整 API 链接"></label><div class="proxy-api-entry-meta"><span data-api-effective></span><span>凭证仅保存在本地</span></div><div data-api-result role="status"></div>`;
  document.getElementById('proxyApiEntries').appendChild(node);
}
function readProxyApiDraftV2() {
  return [...document.querySelectorAll('#proxyApiEntries .proxy-api-entry')].map(row => ({
    id:row.dataset.apiId, name:row.querySelector('[data-api-field=name]').value.trim(),
    provider:row.querySelector('[data-api-field=provider]').value,
    url:row.querySelector('[data-api-field=url]').value.trim(),
    enabled:row.querySelector('[data-api-field=enabled]').checked,
  }));
}
function syncProxyApiDraftV2() {
  const entries = readProxyApiDraftV2();
  document.getElementById('proxyApiDraftSummary').textContent = proxyApiSummaryV2(entries);
  document.getElementById('proxyApiTotalCount').textContent = entries.length;
  document.getElementById('proxyApiEnabledCount').textContent = entries.filter(e => e.enabled).length;
  document.querySelectorAll('#proxyApiEntries .proxy-api-entry').forEach((row, index) => {
    const entry = entries[index];
    row.classList.toggle('is-selected', entry.enabled);
    try {
      const q = new URL(proxyApiEffectiveLinkV2(entry)).searchParams;
      row.querySelector('[data-api-effective]').textContent = `实际请求：${q.get('region') || '全球混播'} · ${q.get('sessType') || proxyApiValueV2('PROXY_API_SESSION_TYPE','sticky')} · ${q.get('stype') || q.get('type')} · ${q.get('count') || q.get('num')} 个出口`;
    } catch (_) { row.querySelector('[data-api-effective]').textContent = '填写地址后显示实际请求参数'; }
  });
}
function openProxyApiManagerV2() {
  try {
    const entries = proxyApiEntriesV2();
    document.getElementById('proxyApiEntries').replaceChildren();
    entries.forEach(renderProxyApiRowV2);
    document.getElementById('proxyApiManagerError').textContent = '';
    syncProxyApiDraftV2();
    document.getElementById('proxyApiManager').showModal();
  } catch (error) { showToast(`API管理配置读取失败：${error.message}`); }
}
document.addEventListener('DOMContentLoaded', () => {
  const dialog = document.getElementById('proxyApiManager');
  dialog.querySelectorAll('[data-api-manager-close]').forEach(button => button.addEventListener('click', () => dialog.close()));
  dialog.addEventListener('input', syncProxyApiDraftV2);
  dialog.addEventListener('change', event => {
    if (event.target.matches('[data-api-field=url]')) {
      event.target.closest('.proxy-api-entry').querySelector('[data-api-field=provider]').value = proxyApiDetectProviderV2(event.target.value);
      syncProxyApiDraftV2();
    }
  });
  document.getElementById('proxyApiAdd').addEventListener('click', () => {
    if (readProxyApiDraftV2().length >= 50) { showToast('最多添加 50 个 API'); return; }
    renderProxyApiRowV2({id:crypto.randomUUID ? crypto.randomUUID() : `api-${Date.now()}-${Math.random().toString(16).slice(2)}`, name:'', url:'', provider:'cliproxy', enabled:true});
    syncProxyApiDraftV2();
    dialog.querySelector('.proxy-api-entry:last-child [data-api-field=name]').focus();
  });
  document.getElementById('proxyApiEntries').addEventListener('click', async event => {
    const button = event.target.closest('[data-api-action]');
    if (!button) return;
    const row = button.closest('.proxy-api-entry');
    if (button.dataset.apiAction === 'delete') { row.remove(); syncProxyApiDraftV2(); return; }
    try {
      const entry = readProxyApiDraftV2().find(x => x.id === row.dataset.apiId);
      const link = proxyApiEffectiveLinkV2(entry);
      if (button.dataset.apiAction === 'test') {
        const status = row.querySelector('[data-api-result]');
        const requested = JSON.stringify(entry);
        button.disabled = true; status.textContent = '正在提取代理并验证 HTTPS 出口…';
        try {
          const result = await api('/api/proxy/source-test', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({entry:{...entry,url:link},region:String(proxyApiValueV2('PROXY_API_REGION','Rand'))})});
          const current = readProxyApiDraftV2().find(x => x.id === entry.id);
          if (JSON.stringify(current) !== requested) { status.textContent = '配置已修改，请重新检测'; return; }
          status.textContent = result.message;
          status.style.color = result.exit_ok ? '#23865c' : '#b57136';
          status.scrollIntoView({block:'nearest'});
        } catch (error) { status.textContent = `检测失败：${error.message}`; }
        finally { button.disabled = false; }
      } else if (button.dataset.apiAction === 'copy') {
        const copied = await copyText(link, false);
        document.getElementById('proxyApiManagerError').textContent = copied ? '已复制当前请求链接' : '复制失败，请重试';
      }
      else window.open(link, '_blank', 'noopener,noreferrer');
    } catch (_) { document.getElementById('proxyApiManagerError').textContent = '请填写有效 HTTP/HTTPS API地址'; }
  });
  document.getElementById('proxyApiSave').addEventListener('click', async event => {
    const draft = JSON.stringify(readProxyApiDraftV2());
    const controls = [...dialog.querySelectorAll('input,select,button')];
    controls.forEach(control => control.disabled = true);
    const preventCancel = event => event.preventDefault();
    dialog.addEventListener('cancel', preventCancel);
    document.getElementById('proxyApiManagerError').textContent = '正在保存…';
    try {
      const result = await api('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({updates:{PROXY_API_SOURCES_JSON:draft}})});
      const field = CONFIG.find(f => f.key === 'PROXY_API_SOURCES_JSON');
      if (field) field.value = draft;
      delete CONFIG_PENDING_UPDATES.PROXY_API_SOURCES_JSON;
      syncProxyModeV2(); syncConfigDirtyIndicatorsV2();
      if (result.reloaded === false) { document.getElementById('proxyApiManagerError').textContent = result.note; return; }
      dialog.close(); showToast('API管理已保存，下一次获取代理生效');
    } catch (error) { document.getElementById('proxyApiManagerError').textContent = error.message; }
    finally { controls.forEach(control => control.disabled = false); dialog.removeEventListener('cancel', preventCancel); }
  });
});
</script>
